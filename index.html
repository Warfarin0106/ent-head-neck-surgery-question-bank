息肉、声带小结、喉头乳头状瘤等良性肿瘤\n\n15 8\n鼻咽癌,分泌中耳炎,淋巴结转移。问:诊断,依据,检查,治疗\n\n14 7\n患者,男,55 岁,持续性进行声音嘶哑一个月,伴咽异物感,无吞咽困难。有 20 年 \n吸烟史,每天 20 支。间接喉镜检查示会厌大,遮盖声门,电子喉镜示左侧声带、前联合菜 \n花状新生物,左侧声带活动困难,右侧良好,无触及淋巴结肿大。 \n1. 还需要做哪些辅助检查 \n2. 该病最可能的诊断是什么?应该与哪些疾病进行鉴别? \n3. 治疗方案\n\n13 7\n男性,30 岁,陕西泾阳人,既往有右化脓性中耳炎病史 20 年。近半年来,听力减退加 \n重,耳流脓增加,有恶臭。且有耳痛、头痛、高烧。近半年反复发作 3 次,去当地医院用抗 \n生素和甘露醇静脉点滴后好转。近日感冒后,又复出现以上症状,一周后渐昏迷不醒,急送 \n我院门诊。查体:体温 38.9°C,浅昏迷状态,右耳道有多量脓液,味臭,鼓膜视不清,右 \n侧瞳孔散大约 4mm,对光反应迟钝。 \n1. 本案例最可能的诊断是什么?写出诊断依据。 \n2. 还需要做哪些检查明确诊断? \n3. 写出治疗原则,简述治疗方法\n\n13 5\n40 多岁的男的,广东人!!!然后就开始典型“三联症”了(鼻咽癌领着分泌中耳炎和颈 \n部淋巴结) \n1. 诊断和诊断依据。 \n2. 为确诊做啥检查? \n3. 如果确诊了,最有效的治疗是?\n\n12 7\n鼻咽癌伴右侧鼓室积液 \n1. 考虑的诊断和鉴别诊断。 \n2. 还应进行的耳鼻喉科专科检查,临床意义。 \n3. 应进行何部位的影像学检查,临床意义。 \n4. 治疗计划。 \n\n12 5\n慢性化脓性中耳炎 \n1. 诊断。 \n2. 需要什么检查? \n3. 治疗原则。 \n\n11 5\n患者,女,12 岁,因睡觉打鼾、进食慢一年,听力下降半年入院。查体:生命体征正 \n常。三大常规检查正常。心电图检查正常。抗链球菌“O”阴性。双侧下颌角淋巴结肿大约 \n1*1*0.5cm 大小,光滑、活动、无压痛。双侧腭舌弓慢性充血,双侧扁桃体III度肥大;经口 \n做鼻咽部触诊可及肥大的增殖体,不易出血。双侧鼓膜内陷,橘红色,活动度受限。 \n问题: \n1. 此病的初步诊断是什么? \n2. 在现有检查资料的基础上,至少再做哪些检查? \n3. 下一步的治疗,可考虑用哪些措施? \n答案: \n1. 小儿 OSAHA、双侧扁桃体肥大、腺体样肥大、双侧分泌性中耳炎(2 分) \n2. PSG、鼻咽部侧位片、纯音测听+声阻抗(必要时颞骨 CT 高分辨率)(4 分) \n3. 手术切除双侧扁桃体、腺样体;鼓膜穿刺术或切开术,必要时鼓膜置管(4 分) \n\n11 7\n喉癌 诊断+需要做哪些检查确诊+治疗 \n\n09 7\n男性,27 岁,两年来耳朵反复流脓,有恶臭,检查鼓膜上有肉芽状和小结痂...... \n问:最可能是那些诊断,可以做哪些检查来确诊?\n\n09 5\n男性,30 岁,陕西泾阳人,既往有右化脓性中耳炎病史 20 年。近半年来,听力减退加重,耳流脓增加,有恶臭。且有耳痛、头痛、高烧。近半年","options":[],"answer":"","is_true":true,"chapter_id":"c03","part":"第二篇 耳科学","chapter":"第一章 耳的应用解剖学及生理学","page":16,"pending_reason":"原题缺少完整答案，须依教材逐问核验"},{"type":"简答题","stem":"梅尼埃病的诊断依据","options":[],"answer":"","is_true":true,"chapter_id":"c12","part":"第二篇 耳科学","chapter":"第十章 耳源性眩晕","page":110,"pending_reason":"原题缺少完整答案，须依教材逐问核验"},{"type":"简答题","stem":"分泌性中耳炎病因及临床表现","options":[],"answer":"","is_true":true,"chapter_id":"c09","part":"第二篇 耳科学","chapter":"第七章 中耳炎性疾病","page":83,"pending_reason":"原题缺少完整答案，须依教材逐问核验"},{"type":"简答题","stem":"鼻咽血管纤维瘤的临床表现","options":[],"answer":"","is_true":true,"chapter_id":"c18","part":"第三篇 鼻科学","chapter":"第一章 鼻的应用解剖学及生理学" 术。\n2骨疡型:耳持续性流粘稠脓,常有臭味。有时可出血。鼓膜紧张部大穿孔或边缘性穿孔,\n病人多有较重的传导性聋。引流通畅者,以局部用药为主,中鼓室肉牙可烧灼或刮匙刮除。\n引流不畅或疑有并发症者,须行乳突手术。\n3胆脂瘤型:耳内长期流脓,有特殊恶臭,一般均有较重的传导性聋,晚期病变波及耳蜗,\n可引起混合性聋。鼓膜松弛部或紧张部后上方有边缘性穿孔,从穿孔处可见鼓室内有灰白色\n鳞屑状或豆渣样无定形物质,奇臭。应及早施行乳突手术,清除病灶。】\n(2)鉴别诊断P91(2 次)\n1慢性鼓膜炎:反复流脓,鼓膜表面有较多肉芽与溃疡,但无穿孔,颞骨CT 亦正常。\n2中耳癌:中老年人好发,鳞状细胞癌为主。"},{"key":"A","text":"症状:有长期流脓史,近期有血性分泌物与耳痛,有面瘫、张口困难。晚期有第VI IX X XI\nXII 脑神经症状。"},{"key":"B","text":"体征:鼓室内或外耳道内有新生物,触之易出血。"},{"key":"C","text":"辅助检查:中耳CT 可见局部腐蚀样骨质破坏。进行新生物活检鉴别。\n3结核性中耳乳突炎:继发于肺结核/肺外结核。\n起病隐匿,脓液稀薄,鼓膜紧张部大穿孔或多发性穿孔,有时可见苍白肉芽,听力损害明显,\n中耳CT 示骨质破坏或死骨形成。"}],"answer":"","is_true":true,"chapter_id":"c09","part":"第二篇 耳科学","chapter":"第七章 中耳炎性疾病","page":83,"pending_reason":"选项或题干混入其他题目，须回查原卷"},{"type":"单选题","stem":"中耳胆脂瘤 (1)临床表现P93(2 次): 1症状:耳流脓、听力下降(同慢性化脓性中耳炎);伴头不舒服、头痛、耳痛等症状;疾 病进展,可出现眩晕、面神经麻痹及其他颅内外并发症症状。","options":[{"key":"A","text":"耳流脓:因厌氧菌感染,脓汁奇臭。炎症重、有肉芽组织生长时,血性分泌物出现。"},{"key":"B","text":"听力下降:与听骨链受累程度及鼓膜形态是否正常有关。"},{"key":"C","text":"眩晕"},{"key":"D","text":"面神经麻痹"},{"key":"E","text":"其他颅内并发症\n2体征:鼓膜准确检查,尤其是显微镜下观察鼓膜至关重要。清除脓性分泌物、痂皮后,可\n见松弛部内陷袋入口或紧张部鼓膜后上方内陷,并可见内陷袋内白色脱离上皮。\n3辅助检查"},{"key":"A","text":"纯音测听检查:传导性聋"},{"key":"B","text":"颞骨CT:上鼓室、鼓窦和乳突区有骨质破坏,边缘浓密整齐。\n18五临wyc\n\n4\n(2)鉴别诊断:与慢性化脓性中耳炎\n(3)治疗P93-94:尽早手术治疗。"},{"key":"A","text":"中耳胆脂瘤的手术治疗原则:\n1彻底清除胆脂瘤及其他肉芽和炎性病变;\n2努力保存和改善听觉功能(鼓室成形术的基本要求);\n3尽量保持外耳道的生理结构和功能。"},{"key":"B","text":"预期治疗目标:\n1获得干耳;\n2保持或改善听力;\n3恢复正常的日常生活。"}],"answer":"","is_true":true,"chapter_id":"c09","part":"第二篇 耳科学","chapter":"第七章 中耳炎性疾病","page":83,"pending_reason":"选项混入其他题组或出现重复字母，须回查原卷"},{"type":"单选题","stem":"耳源性颅、内外并发症 (1)病因P96","options":[{"key":"A","text":"骨质破坏:最多见于中耳胆脂瘤"},{"key":"B","text":"机体抵抗力差:严重的全身慢性疾病、长期营养不良、年老体弱或儿童等抵抗力较差者"},{"key":"C","text":"致病菌毒力强:致病菌对常用抗生素不敏感或已产生抗药性\n(2)耳源性并发症的感染扩散途径P96"},{"key":"A","text":"通过骨壁缺损区扩散"},{"key":"B","text":"经解剖通道或未闭骨缝扩散"},{"key":"C","text":"经血行途径扩散\n(3)分类P97(13 次)"},{"key":"A","text":"颅内并发症:硬脑膜外脓肿、硬脑膜下脓肿、化脓性脑膜炎、脑脓肿、乙状窦血栓性静\n脉炎等"},{"key":"B","text":"颅外并发症:耳后骨膜下脓肿、耳下颈深部(Bezold 和Mouret)脓肿、岩尖炎、岩锥炎、\n迷路炎、周围性面瘫等。\n【曾考:耳源性脑脓肿的临床表现P99;颈部贝佐尔德脓肿P102;局限性迷路炎的临床表\n现P103】\n1耳源性脑脓肿的临床表现P99(四期:初期/起病期、潜伏期/隐匿期、显症期、终末期)\n2颈部贝佐尔德脓肿P102(名词解释,2 次):乳突尖部气房发育良好时,乳突尖内侧骨壁\n一般较薄。若乳突蓄脓,可穿破该处骨壁,脓液循此溃破口流入胸锁乳突肌深面,在颈侧形\n成脓肿,称贝佐尔德脓肿。\n3局限性迷路炎的临床表现P103"},{"key":"A","text":"中耳炎或中耳胆脂瘤病史。"},{"key":"B","text":"眩晕阵发性或继发性眩晕,偶伴恶心呕吐。病侧迷路处于刺激状态,自发性眼震快相朝\n向病侧。当耳道受到压力如挖耳、压迫耳屏或擤鼻时,诱发短暂的眩晕有诊断意义。"},{"key":"C","text":"听力减退。"},{"key":"D","text":"瘘管试验阳性。"},{"key":"E","text":"前庭功能改变。"}],"answer":"","is_true":true,"chapter_id":"c10","part":"第二篇 耳科学","chapter":"第八章 耳源性颅内、外并发症","page":94,"pending_reason":"选项或题干混入其他题目，须回查原卷"},{"type":"单选题","stem":"额窦骨折的临床表现P193(1 次) (1)额窦骨折多合并颅脑外伤,分脑部症状和额窦局部症状。 1)脑部症状: 2)局部症状:鼻出血、额部肿胀或凹陷、眶上缘后移、眼球下移等 3)鼻额筛眶复合体骨折,还常合并额隐窝骨折、泪器损伤和视力障碍。 (2)额窦骨折从部位(前壁骨折、后壁骨折)、类型(可分为线型骨折、凹陷型骨折、粉碎 型骨折)分类 1)前壁骨折","options":[{"key":"A","text":"线型骨折:症状较轻,仅表现为鼻出血、软组织肿胀和压痛"},{"key":"B","text":"凹陷型骨折:急性期额部肿胀,肿胀消退后则显现前额凹陷。"},{"key":"C","text":"粉碎型骨折:眶上区肿胀、皮下积气、眶上缘后移、眼球向下移位。\n2)后壁骨折:伴脑膜撕裂可出现脑脊液鼻漏、颅内出血、颅前窝积气可继发严重的颅内感\n染。"}],"answer":"","is_true":true,"chapter_id":"c31","part":"第三篇 鼻科学","chapter":"第十四章 鼻出血","page":222,"pending_reason":"原资料未提供可靠答案"},{"type":"单选题","stem":"鼻窦解剖结构与鼻窦炎的关系P201 (1)窦口小,鼻道狭窄而曲折,易于阻塞,引起鼻窦通气引流障碍。 (2)鼻窦黏膜与鼻腔黏膜相连续,鼻腔黏膜炎症常累及鼻窦黏膜。 (3)各窦口彼此毗邻,一窦发病可累及他窦。 如额窦、前组筛窦和上颌窦均开口于中鼻道的半月裂,上颌窦开口位于半月裂的下部,额窦 或前组筛窦有炎症时,引流易经半月裂开口处流入上颌窦,引起上颌窦炎。 (4)各窦自身解剖学特点","options":[{"key":"A","text":"上颌窦最大,窦口高,窦腔炎症时窦内分泌物不易引流。"},{"key":"B","text":"筛窦为蜂房状结构,又称“筛迷路”,各气房间引流小,感染后窦黏膜肿胀,窦口易阻塞,\n引流不畅。"},{"key":"C","text":"额窦虽位置高、窦口低,但鼻额管易受气化良好的筛房挤压而狭窄,狭窄的鼻额管是额\n窦引流不畅的主要原因。\n18五临wyc\n\n7"},{"key":"D","text":"蝶窦位于各窦之后上,且单独开口,发病机会相对较少。\n(5)各鼻窦发育时间不一,上颌窦和筛窦发育最早,故儿童期即可罹患炎症。"}],"answer":"","is_true":true,"chapter_id":"c18","part":"第三篇 鼻科学","chapter":"第一章 鼻的应用解剖学及生理学","page":150,"pending_reason":"原资料未提供可靠答案"},{"type":"单选题","stem":"鼻源性并发症P228(2 次) (1)鼻源性眶内并发症","options":[{"key":"A","text":"眶周蜂窝织炎"},{"key":"B","text":"眶壁骨膜下脓肿"},{"key":"C","text":"眶内蜂窝织炎"},{"key":"D","text":"眶内脓肿"},{"key":"E","text":"球后视神经炎\n(2)鼻源性颅内并发症"},{"key":"A","text":" 、X、XII 对脑神经,可出现软腭瘫痪、\n进食呛咳、声嘶、伸舌偏斜等症状。\n5远处转移:晚期鼻咽癌可出现远处转移,常见转移部位为骨、肺、肝。\n18五临wyc\n\n10\n(2)诊断P298(2 次)"},{"key":"A","text":"详细询问病史"},{"key":"B","text":"患者出现不明原因的回吸涕中带血、单侧鼻塞、耳鸣、耳闷塞感、听力下降、头痛、复\n视或颈深上淋巴结肿大等症状,尽早进行间接鼻咽镜或鼻内镜检查,并行鼻咽部活检。(鼻\n咽部首次活检阴性或鼻咽黏膜外观正常并不能排除鼻咽癌。必要时多次活检。)"},{"key":"C","text":"进行EB 病毒血清学(鼻咽癌诊断辅助指标)、影像学检查,以明确诊断。\n(3)治疗原则P298:鼻咽癌大部分为低分化鳞癌,首选放射治疗,在放疗期间可配合化疗、\n中医中药及免疫治疗,以防止远处转移,提高放疗敏感性和减轻放疗并发症。"}],"answer":"","is_true":true,"chapter_id":"c75","part":"第七篇 颈科学","chapter":"第七章 颈部肿块","page":404,"pending_reason":"选项混入其他题组或出现重复字母，须回查原卷"},{"type":"单选题","stem":"OSAHS (1)定义P303(名词解释,4 次):即阻塞性睡眠呼吸暂停低通气综合征,是指睡眠时上气 道塌陷阻塞引起的呼吸暂停和低通气,通常伴有打鼾、睡眠结构紊乱、频繁发生血氧饱和度 下降、白天嗜睡、注意力不集中等病症,并可导致高血压、冠状动脉粥样硬化性心脏病、糖 尿病等多器官多系统损害。 (2)临床表现P304 1症状","options":[{"key":"A","text":"睡眠打鼾、呼吸暂停:严重者可有夜间憋醒现象,多数患者仰卧位时加重"},{"key":"B","text":"白天嗜睡:轻度表现为轻度困倦乏力,重者可有不可抑制的嗜睡"},{"key":"C","text":"记忆力减退,注意力不集中,反应迟钝"},{"key":"D","text":"晨起口干、咽喉异物感,晨起后头疼,血压升高"},{"key":"E","text":"部分重症患者可出现性功能障碍,夜尿次数增加甚至遗尿"},{"key":"F","text":"烦躁、易怒或抑郁等性格改变,一般见于病程较长患者"},{"key":"G","text":"儿童患者还可出现颌面发育畸形、生长发育迟缓、胸廓发育畸形、学习成绩下降等表现。\n2体征"},{"key":"A","text":"一般征象:成人患者多数肥胖,儿童患者一般发育较差,可有颅面发育异常,还可见胸\n廓发育畸形。"},{"key":"B","text":"上气道征象:咽腔尤其是口咽腔狭窄,可见扁桃体肥大、软腭肥厚松弛、悬雍垂肥厚过\n长等;部分患者还可见腺样体肥大、鼻中隔偏曲、鼻甲肥大、鼻息肉等。\n(3)整夜多导睡眠图PSG 监测是诊断OSAHS 的标准手段。\n第五篇喉科学"}],"answer":"","is_true":true,"chapter_id":"c46","part":"第四篇 咽科学","chapter":"第十一章 阻塞性睡眠呼吸暂停低通气综合征","page":285,"pending_reason":"选项混入其他题组或出现重复字母，须回查原卷"},{"type":"单选题","stem":"喉阻塞 (1)临床表现P360(2 次) 1吸气性呼吸困难(与呼气性、混合性呼吸困难的鉴别要点P361) 2吸气性喉喘鸣 3吸气性软组织凹陷:胸骨上窝,锁骨上、下窝,胸骨剑突下或上腹部、肋间隙于吸气时向 内凹陷,为四凹征。 4声嘶 5发绀 (2)分度P360(10 次) 1一度:安静时无呼吸困难。活动或哭闹时有轻度吸气性呼吸困难、稍有吸气性喉喘鸣及吸 气性胸廓周围软组织凹陷。(安静无,活动有) 2二度:安静时也有轻度吸气性呼吸困难、吸气性喉喘鸣和吸气性胸廓周围软组织凹陷,活 动时加重,但不影响睡眠和进食,无烦躁不安等缺氧症状。脉搏尚正常。(安静有,活动加 重) 3三度:吸气性呼吸困难明显,喉喘鸣声较响,吸气性胸廓周围软组织凹陷显著,并出现缺 氧症状,如烦躁不安、不易入睡、不愿进食、脉搏加快等(二度+缺氧症状) 4四度:呼吸极度困难。患者坐卧不安,手足乱动,出冷汗,面色苍白或发绀,定向力丧失, 心律不齐,脉搏细数,昏迷、大小便失禁等。若不及时抢救,则可因窒息以致呼吸心跳停止 而死亡。(三度+末梢循环障碍症状) (3)治疗P361(5 次)对急性喉梗阻的患者,须争分夺秒,因地制宜,迅速解除呼吸困难, 以免造成窒息或心力衰竭。 1一度:明确病因,积极进行病因治疗。如由炎症引起,使用足量抗生素+糖皮质激素 2二度","options":[{"key":"A","text":"由炎症引起:足量抗生素+糖皮质激素,大多可避免气管切开术"},{"key":"B","text":"异物引起:尽快取除"},{"key":"C","text":"喉肿瘤、喉外伤、双侧声带瘫痪等一时不能去除病因者:考虑做气管切开术\n18五临wyc\n\n12\n3三度"},{"key":"A","text":"炎症引起:喉阻塞时间较短者,密切观察下可积极使用药物治疗,并做好气管切开术的\n准备。若药物治疗未见好转,全身情况较差,及早进行气切。"},{"key":"B","text":"肿瘤引起:气切\n4四度:立即气切。若病情十分紧急时,可先行环甲膜切开术。待呼吸困难缓解后再作常规\n气管切开术,然后再寻找病因进一步治疗。"}],"answer":"","is_true":true,"chapter_id":"c57","part":"第五篇 喉科学","chapter":"第十一章 喉阻塞","page":338,"pending_reason":"选项或题干混入其他题目，须回查原卷"},{"type":"单选题","stem":"气管切开术 (1)适应证P363(5 次)","options":[{"key":"A","text":"喉阻塞:任何原因引起的3-4 度喉阻塞,尤其病因不能很快解除时。"},{"key":"B","text":"下呼吸道分泌物潴留、阻塞:如昏迷、颅脑病变、多发性神经炎、呼吸道烧伤、胸部外\n伤。"},{"key":"C","text":"某些手术的前置手术:如颌面部、口腔、咽、喉部手术时,为防止血液流入下呼吸道或\n术后局部肿胀阻碍呼吸,行预防性气管切开术。"},{"key":"D","text":"需长时间使用呼吸机辅助呼吸者。"},{"key":"E","text":"颈部外伤伴有咽喉或气管、颈段食管损伤者。\n(2)术后并发症P366(2 次)"},{"key":"A","text":"皮下气肿"},{"key":"B","text":"纵隔气肿"},{"key":"C","text":"气胸"},{"key":"D","text":"出血"},{"key":"E","text":"拔管困难\n(3)注意事项\n1体位:平仰卧,垫肩,头后仰,颈后伸拉长,使下颏、甲状软骨结合部和胸骨上凹成一条\n线。\n2沿颈正中线切开皮肤,两侧拉钩应力量均等,保持正中位,常以手指触摸气管,小儿更应\n谨慎。\n3沿中线上下分离,勿在皮下及气管筋膜前左右分离。\n4切气管前用空针穿刺气管,证实为气管时再切开气管的2-3 环或3-4 环,小儿应注意不\n要切的太低。\n5切开气管时勿用力过猛,伤及气管后壁及食道前壁。最好用镰状刀挑切开。\n6插入套管后应用棉絮置于管口,并观察是否随呼吸上下飘动,以保证套管插入气管内,术\n后勿忘记放入套管内管。\n7切口不长,一般不缝合。\n第六篇气管食管科学"}],"answer":"","is_true":true,"chapter_id":"c58","part":"第五篇 喉科学","chapter":"第十二章 气管插管术及气管切开术","page":340,"pending_reason":"选项或题干混入其他题目，须回查原卷"},{"type":"单选题","stem":"气管异物、支气管异物的临床表现P390(2 次) (1)临床分期","options":[{"key":"A","text":"异物吸入期"},{"key":"B","text":"安静期"},{"key":"C","text":"炎症期"},{"key":"D","text":"并发症期\n(2)气管异物的临床表现:异物进入气管立即发生剧烈呛咳,并有憋气、呼吸不畅等症状。\n随着异物贴附于气管壁,症状可暂时缓解;若异物轻而光滑并随呼吸气流在声门裂和支气管\n之间上下活动,可出现刺激性咳嗽,闻及拍击音;如异物较大,阻塞气管,随时可能上至声\n门引起呼吸困难或窒息。\n(3)支气管异物的临床表现"},{"key":"A","text":"患者有咳嗽、喘、发热等症状,非活动性支气管异物,可引起一系列具有特征性的临床\n表现,如肺气肿、肺不张、支气管肺炎等。"},{"key":"B","text":"长期停留者甚至导致支气管扩张、肺脓肿。"},{"key":"C","text":"尖锐异物对支气管壁有损伤者还可引起纵隔气肿和气胸。"},{"key":"D","text":"呼吸困难的程度与异物部位及阻塞程度有关。主支气管完全阻塞时,听诊患侧呼吸音消\n失;不完全阻塞时,可出现一侧呼吸音降 function buildFilters(){let parts=[...new Set(DATA.chapters.map(c=>c.part))];$('#chapters').innerHTML=parts.map(p=>`<div><b>${esc(p)}</b>${DATA.chapters.filter(c=>c.part===p).map(c=>`<label><input type="checkbox" class="ch" value="${c.id}" checked> ${esc(c.chapter_no+' '+c.title)} <small>(${DATA.questions.filter(q=>q.chapter_id===c.id).length})</small></label>`).join('')}</div>`).join('');$('#types').innerHTML=TYPES.map(t=>`<label><input type="checkbox" class="ty" value="${t}" checked> ${t}</label>`).join('');if(VARIANT==='random')$('#typeCounts').innerHTML=TYPES.map(t=>`<span>${t}</span><input type="number" min="0" value="0" data-type="${t}" title="0表示不按题型单独指定">`).join('')}
function selected(){let cs=new Set($$('.ch:checked').map(x=>x.value)),ts=new Set($$('.ty:checked').map(x=>x.value));return DATA.questions.filter(q=>cs.has(q.chapter_id)&&ts.has(q.type))}
function start(){let pool=selected();if(!pool.length){alert('当前筛选没有可用题目。');return}if(VARIANT==='random'){let counts={};$$('#typeCounts input').forEach(x=>counts[x.dataset.type]=+x.value||0);let specified=Object.values(counts).some(Boolean), out=[];if(specified){for(let t of TYPES){let a=pool.filter(q=>q.type===t).sort(()=>Math.random()-.5);if(counts[t]>a.length){alert(`${t}仅有${a.length}题，无法抽取${counts[t]}题。`);return}out.push(...a.slice(0,counts[t]))}}else{let n=+$('#totalN').value||20;if(n>pool.length){alert(`当前条件只有${pool.length}题，请减少抽题数量。`);return}out=pool.sort(()=>Math.random()-.5).slice(0,n)}state.list=out.sort(()=>Math.random()-.5).map(q=>q.id)}else state.list=pool.map(q=>q.id);state.i=0;state.answers={};state.submitted={};state.testDone=false;state.review=false;save();render()}
function current(){return DATA.questions.find(q=>q.id===state.list[state.i])}
function isObj(q){return ['单选题','多选题','判断题','配伍题'].includes(q.type)}
function readAnswer(q){if(isObj(q))return $$('.option input:checked').map(x=>x.value).sort().join('');return $('#subjective')?.value||''}
function correct(q,a){return String(a).split('').sort().join('')===String(q.answer).split('').sort().join('')}
function submit(){let q=current(),a=readAnswer(q);state.answers[q.id]=a;if(state.mode==='test'){next();return}state.submitted[q.id]=true;if(isObj(q)&&!correct(q,a))state.wrong[q.id]=true;save();render();if(state.mode==='quick'&&isObj(q)&&correct(q,a))setTimeout(next,450)}
function next(){if(state.i<state.list.length-1){state.i++;save();render()}else if(state.mode==='test')finishTest()}
function prev(){if(state.i>0){state.i--;save();render()}}
function finishTest(){state.testDone=true;state.list.forEach(id=>{let q=DATA.questions.find(x=>x.id===id);if(isObj(q)&&!correct(q,state.answers[id]||''))state.wrong[id]=true});save();renderScore()}
function renderScore(){let groups={};for(let id of state.list){let q=DATA.questions.find(x=>x.id===id),g=groups[q.chapter]??={right:0,total:0,subjective:0};if(isObj(q)){g.total++;if(correct(q,state.answers[id]||''))g.right++}else g.subjective++}$('#work').innerHTML=`<div class="question"><h2>测试结算</h2>${Object.entries(groups).map(([k,v])=>`<div class="score-row"><b>${esc(k)}</b><br>${v.total?`${v.right} / ${v.total}（${Math.round(v.right/v.total*100)}%）`:'无自动计分题'}${v.subjective?`；主观题完成 ${v.subjective} 题`:''}</div>`).join('')}<p><button class="primary" onclick="state.review=true;state.i=0;save();render()">查看答案与解析</button></p></div>`}
function render(){if(state.mode==='test'&&state.testDone&&!state.review){renderScore();return}let q=current();if(!q){$('#work').innerHTML='<div class="notice">请选择范围并开始。</div>';return}let shown=state.mode==='memory'||state.submitted[q.id]||(state.mode==='test'&&state.testDone&&state.review);let ans=state.answers[q.id]||'';let input='';if(isObj(q)){let multi=q.type==='多选题'||q.type==='配伍题';input=q.options.map(o=>`<label class="option"><input type="${multi?'checkbox':'radio'}" name="ans" value="${o.key}" ${ans.includes(o.key)?'checked':''} ${shown&&state.mode!=='test'?'disabled':''}> <b>${o.key}.</b> ${esc(o.text)}</label>`).join('')}else input=`<textarea id="subjective" placeholder="在此输入作答要点">${esc(ans)}</textarea>`;let result=shown&&isObj(q)?`<p class="${correct(q,ans)?'ok':'bad'}"><b>${correct(q,ans)?'回答正确':'回答不正确'}</b></p>`:'';let answer=shown?`<div class="answerbox">${result}<b>答案：</b>${esc(q.answer)}<br><b>解析：</b>${esc(q.analysis)}<br><small>教材依据：${esc(q.chapter)}，第${q.page}页起。</small></div>`:'';$('#work').innerHTML=`<div class="question"><div class="meta"><span class="badge">${esc(q.type)}</span>${q.is_true?'<span class="badge true">【真题】</span>':''}<span>${esc(q.part)} · ${esc(q.chapter)}</span><span>${state.i+1}/${state.list.length}</span><button onclick="toggleFav('${q.id}')">${state.fav[q.id]?'★ 已收藏':'☆ 收藏'}</button></div><div class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</div>${input}${answer}<div class="nav"><button onclick="prev()" ${state.i===0?'disabled':''}>上一题</button><div>${!shown&&state.mode!=='memory'?`<button class="primary" onclick="submit()">${state.mode==='test'?'保存并下一题':'提交'}</button>`:''} ${shown&&state.mode==='quick'&&!isObj(q)?'<button onclick="next()">已掌握</button><button onclick="state.wrong[current().id]=true;save();render()">需复习</button>':''}</div><button onclick="next()" ${state.i===state.list.length-1?'disabled':''}>下一题</button></div></div><div class="jump">${state.list.map((id,j)=>`<button class="${j===state.i?'current':''}" onclick="state.i=${j};save();render()">${j+1}</button>`).join('')}</div>`}
function toggleFav(id){state.fav[id]=!state.fav[id];save();render()}
function changeMode(){let v=$('#mode').value;if(state.mode==='test'&&!state.testDone&&Object.keys(state.answers).length&&v!=='test'&&!confirm('测试尚未交卷。结束测试并切换模式吗？')){$('#mode').value='test';return}state.mode=v;state.testDone=false;state.review=false;save();render()}
function only(kind){let ids=kind==='wrong'?Object.keys(state.wrong).filter(x=>state.wrong[x]):Object.keys(state.fav).filter(x=>state.fav[x]);state.list=ids.filter(id=>DATA.questions.some(q=>q.id===id));state.i=0;render()}
function exportRec(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`耳鼻喉题库-${VARIANT}-记录.json`;a.click();URL.revokeObjectURL(a.href)}
function importRec(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{state={...state,...JSON.parse(r.result)};save();render()}catch(e){alert('记录文件格式不正确')}};r.readAsText(f)}
buildFilters();load();$('#mode').value=state.mode;if(!state.list.length)start();else render();
</script></body></html>
